<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DENT 545 | From notes to Naive Bayes</title>
<style>
:root{font-family:system-ui,sans-serif;color:#142c40;background:#edf3f8;font-size:17px}*{box-sizing:border-box}body{margin:0}header{background:#103b50;color:white;padding:22px max(20px,calc((100% - 1060px)/2))}header p{color:#cae1ea;margin:6px 0}h1{font-size:1.8rem;margin:8px 0}h2{font-size:1.45rem}h3{font-size:1.05rem}main{max-width:1060px;margin:auto;padding:20px}nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}button,select,input{font:inherit}button{background:#166681;color:white;border:2px solid transparent;border-radius:8px;padding:10px 15px;cursor:pointer;min-height:44px}button:hover{background:#104a61}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #d18400;outline-offset:3px}nav button{background:white;color:#164358;border:1px solid #a9becb;font-size:.85rem}nav button[aria-current=step]{background:#103b50;color:white}button:disabled{opacity:.45;cursor:default}section,.card{background:white;border:1px solid #ccdbe5;border-radius:12px;padding:22px;margin-bottom:15px}p,li{line-height:1.6}.muted{color:#526777}.note{background:#e5f3fa;border-left:5px solid #166681;padding:13px 16px}.feedback{margin-top:12px;padding:12px;background:#edf4f8;border-radius:6px;min-height:1em}.good{background:#e5f5ec}.bad{background:#fff0db}.row{display:flex;gap:15px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.pill{display:inline-block;padding:5px 10px;background:#e7eef4;border-radius:6px;margin:3px;font-size:.9rem}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;margin:12px 0}th,td{text-align:left;padding:11px;border-bottom:1px solid #d5e0e7}th{background:#edf4f8}select,input{border:1px solid #829eaf;border-radius:5px;padding:10px;max-width:100%;background:white}input[type=text]{width:100%}label{display:block;margin:9px 0}.choices button{display:block;margin:8px 0;text-align:left;width:100%;background:#edf4f8;color:#173a4e;border:1px solid #a8c2d0}.bar{height:12px;border-radius:6px;background:#dce9f1;margin:8px 0}.bar span{display:block;height:100%;background:#16836d;border-radius:6px}.foot{display:flex;justify-content:space-between;gap:12px;margin:18px 0}.small{font-size:.86rem}details{margin:16px 0}summary{cursor:pointer;font-weight:650}#stage:focus{outline:none}a{color:#166681}@media(max-width:600px){main{padding:12px}section{padding:16px}h1{font-size:1.5rem}th,td{padding:8px}header{padding:18px}}
</style></head><body>
<header><p>DENT 545 · Introduction to NLP · Activity v2</p><h1>From dental notes to a trained model</h1><p>A guided Naive Bayes activity · 25–35 minutes · No coding needed</p></header>
<main><nav aria-label="Activity steps" id="nav"></nav><div class="row"><span id="progress" class="muted small"></span><button id="restart" style="margin-left:auto">Restart activity</button></div><section id="stage" tabindex="-1" aria-label="Current activity"></section><div class="foot"><button id="back">Back</button><button id="next">Next step</button></div><p class="small muted">All notes are fictional. Work alone or discuss with a partner. Nothing is submitted or sent anywhere. Your progress lasts while this page stays open.</p></main>
<script>
'use strict';
const classes=['Smoker','Non-smoker','Unknown'];
const notes=[
 {id:'A',text:'SMOKES cigarettes daily.',gold:0}, {id:'B',text:'Smokes cigarettes daily.',gold:0},
 {id:'C',text:'Never smoked tobacco.',gold:1}, {id:'D',text:'Never smoked cigarettes.',gold:1},
 {id:'E',text:'Smoking status unknown.',gold:2}, {id:'F',text:'Smoking status undocumented.',gold:2},
 {id:'G',text:'Smokes cigarettes.',gold:0}, {id:'H',text:'Never smoked.',gold:1},
 {id:'I',text:'Smoking status unknown.',gold:2}];
const names=['Collect','Clean','Label','Split','Train','Test','Apply','Explain'];
let step=0,cleaned=false,labels={},split={},trained=false,tested=false,applied=false,checked={},unlocked=0;
let model=null;const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function tokens(s){return s.toLowerCase().match(/[a-z]+/g)||[];}
function fit(){let train=notes.slice(0,6),vocab=[...new Set(train.flatMap(n=>tokens(n.text)))].sort(),counts=classes.map(()=>({})),totals=[0,0,0];train.forEach(n=>tokens(n.text).forEach(w=>{counts[n.gold][w]=(counts[n.gold][w]||0)+1;totals[n.gold]++}));return {vocab,counts,totals,priors:[1/3,1/3,1/3]};}
function predict(text){let words=tokens(text),known=words.filter(w=>model.vocab.includes(w)),ignored=words.filter(w=>!model.vocab.includes(w));let logs=classes.map((_,c)=>Math.log(model.priors[c])+known.reduce((sum,w)=>sum+Math.log(((model.counts[c][w]||0)+1)/(model.totals[c]+model.vocab.length)),0));let max=Math.max(...logs),weights=logs.map(v=>Math.exp(v-max)),sum=weights.reduce((a,b)=>a+b,0),probs=weights.map(v=>v/sum);let tied=logs.filter(v=>Math.abs(v-max)<1e-10).length>1;return {pred:logs.indexOf(max),probs,known,ignored,tied};}
function feedback(id,text,ok){$(id).textContent=text;$(id).className='feedback '+(ok?'good':'bad');}
function quiz(id,prompt,options,answer,why){return `<div class="card"><h3>${prompt}</h3><div class="choices">${options.map((o,i)=>`<button onclick="answerQuiz('${id}',${i},${answer},'${esc(why)}')">${o}</button>`).join('')}</div><div id="${id}" class="feedback" role="status"></div></div>`;}
function answerQuiz(id,i,a,why){checked[id]=i===a;feedback(id,(i===a?'Yes. ':'Try again. ')+why,i===a);}
function render(){ $('nav').innerHTML=names.map((n,i)=>`<button ${i>unlocked?'disabled':''} aria-current="${step===i?'step':'false'}" onclick="go(${i})">${i+1}. ${n}</button>`).join('');$('progress').textContent=`Step ${step+1} of 8`; $('back').disabled=step===0;$('next').disabled=step===7;$('next').textContent='Next step';let content='';
if(step===0)content=`<h2>1. Collect the notes</h2><p>Your research question: <strong>Can a model identify smoking status from a short dental note?</strong> A model is a computer program that learns patterns from examples.</p><div class="grid"><div class="note"><strong>In the paper’s figure</strong><p>One visit per patient, January 2009–December 2011. Cleaning left 6,410 records. Humans labeled 3,296; the other 3,114 were unlabeled.</p></div><div class="note"><strong>In our activity</strong><p>Nine short, fictional notes. We teach Naive Bayes using three labels: smoker, non-smoker and unknown. This is a simplified classroom example.</p></div></div><p><strong>Your first note:</strong> “SMOKES cigarettes daily.” What information do you want the computer to return?</p>${quiz('collect','Choose the output',['The patient’s name','A smoking-status label','A new dental note'],1,'Our task is classification: assigning a note to a category.')}<details><summary>How this relates to the paper</summary><p>The figure compares machine-learning classifiers and reports SVM as the final selected model. Our Naive Bayes activity demonstrates the workflow, not the paper’s exact model or results. The figure also separates smokers into six subgroups later.</p></details>`;
if(step===1)content=`<h2>2. Clean the text</h2><p>Computers need a consistent format. Here we make letters lowercase and remove punctuation. Then we split text into words, called <strong>tokens</strong>.</p><div class="card"><h3>Before</h3><p>SMOKES cigarettes daily.</p><button onclick="cleaned=true;render()">Clean this note</button>${cleaned?'<h3>After</h3><p><span class="pill">smokes</span><span class="pill">cigarettes</span><span class="pill">daily</span></p>':''}</div>${quiz('negation','Should we remove “never” from “Never smoked”?',['Yes: it is a small word','No: it changes the meaning'],1,'Keep negation words such as no, not and never. Removing them can change the meaning.')}<p class="note">The figure says “cleaned and preprocessed”; it does not specify these cleaning rules. These are our teaching choices.</p>`;
if(step===2)content=`<h2>3. Give the notes human labels</h2><p><strong>Annotation</strong> means a person reads a note and gives it a label. These checked labels form a <strong>reference standard</strong>: the answers used for learning and evaluation.</p><p>For this exercise: <strong>Smoker</strong> = current smoking stated; <strong>Non-smoker</strong> = never smoking stated; <strong>Unknown</strong> = status missing or unclear. Do not assume that silence means non-smoker.</p><div class="table-wrap"><table><thead><tr><th>Note</th><th>Your label</th></tr></thead><tbody>${notes.map(n=>`<tr><td><strong>${n.id}</strong> · ${n.text}</td><td><select data-note-label="${n.id}" aria-label="Label note ${n.id}" onchange="setNoteLabel('${n.id}',this.value)"><option value="">Choose…</option>${classes.map((c,i)=>`<option value="${i}" ${labels[n.id]===String(i)?'selected':''}>${c}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div><button onclick="checkLabels()">Check my labels</button><div id="labelFeedback" class="feedback" role="status"></div><details><summary>What about “quit smoking”?</summary><p>A real project needs a precise annotation guide for former smokers and ambiguous notes. The paper’s figure includes a “past” smoking subgroup. We keep our nine training/test notes simpler; former smoking returns as a challenge later.</p></details>`;
if(step===3)content=`<h2>4. Keep learning and testing separate</h2><p>The <strong>training set</strong> teaches the model. The <strong>test set</strong> checks it on examples it did not learn from. Think: practice questions versus a final exam.</p><div class="note">The paper: 2,176 training records (66%) and 1,120 test records (34%), from the 3,296 labeled records. Our miniature version: six training notes and three test notes.</div><p>Put A–F in training and G–I in test. Each group includes all three labels. This fixed split makes everyone’s classroom results comparable.</p><div class="table-wrap"><table><tr><th>Note</th><th>Put it in…</th></tr>${notes.map(n=>`<tr><td>${n.id} · ${n.text}</td><td><select data-note-split="${n.id}" aria-label="Split note ${n.id}" onchange="setNoteSplit('${n.id}',this.value)"><option value="">Choose…</option>${['Training','Test'].map(c=>`<option ${split[n.id]===c?'selected':''}>${c}</option>`).join('')}</select></td></tr>`).join('')}</table></div><button onclick="checkSplit()">Check the split</button><div id="splitFeedback" class="feedback" role="status"></div>${quiz('leak','Can the model study the test answers before the exam?',['Yes, to improve its score','No, that would make the test unfair'],1,'Using test data to train or tune the model is data leakage. Learn the vocabulary and word counts from training notes only.')}`;
if(step===4)content=`<h2>5. Train Naive Bayes</h2><p>Training here means <strong>counting words separately for each label</strong>. The model also counts how common each label is. It uses those counts to compare possible labels for a new note.</p><p>Click Train. Only A–F are used; G–I stay out of training.</p><button onclick="model=fit();trained=true;render()">Train on six notes</button>${trained?trainingView():''}`;
if(step===5)content=`<h2>6. Test on unseen notes</h2><p>The model is now fixed. First predict which label it will assign to each test note; then reveal its predictions and compare them with the human labels.</p>${notes.slice(6).map(n=>`<div class="card"><strong>${n.id} · ${n.text}</strong><label>Your guess <select aria-label="Guess note ${n.id}"><option>Choose…</option>${classes.map(c=>`<option>${c}</option>`).join('')}</select></label></div>`).join('')}<button onclick="tested=true;render()">Reveal predictions and scores</button>${tested?testView():''}<p class="note">These few repetitive notes are for learning. A high score here does not tell us how well a model will work on real patient records.</p>`;
if(step===6)content=`<h2>7. Apply the model to unlabeled notes</h2><p>The paper applied its selected model to the remaining 3,114 records, then manually checked 315 assigned statuses. A prediction is not automatically a correct answer.</p><label for="newNote"><strong>Try a fictional note</strong></label><input id="newNote" type="text" maxlength="300" value="Smokes tobacco daily."><div class="row" style="margin-top:12px"><button onclick="applyNote()">Predict the label</button><button onclick="$('newNote').value='Never smokes cigarettes.';applyNote()">Try a negation challenge</button><button onclick="$('newNote').value='Quit smoking years ago.';applyNote()">Try former smoking</button></div><div id="prediction" role="status"></div><p class="note">An unlabeled note has no checked human answer, so we cannot calculate accuracy from its prediction alone. Human review is still needed.</p><details><summary>The paper’s second classification step</summary><p>After identifying smokers, it classified them as light, intermediate, intermittent, past, heavy or unknown intensity. Our model only learns the first three broad labels. A second model would need examples labeled with these subgroups.</p></details>${quiz('subgroup','“Smokes; amount not recorded.” Which smoking subgroup best fits?',['Heavy','Unknown intensity','Non-smoker'],1,'The note supports smoking, but not an intensity. Missing detail does not justify a guess.')}`;
if(step===7)content=`<h2>8. Explain the pipeline to a partner</h2><p>You have followed a model from text to predictions. Say what each step does using everyday language.</p><div class="grid"><div class="card"><h3>The paper, in numbers</h3><p>6,410 cleaned records</p><p>3,296 human-labeled → 2,176 train + 1,120 test</p><p>3,114 unlabeled → model predictions</p><p>315 predictions manually checked</p></div><div class="card"><h3>Your miniature model</h3><p>Nine labeled notes → six train + three test</p><p>Training learned word counts.</p><p>Testing compared predictions with human answers.</p><p>New notes received predictions, which still need checking.</p></div></div>${quiz('exit1','Which step creates the answers that training needs?',['Cleaning','Human annotation','Applying the model'],1,'Human annotation creates the reference labels.')}${quiz('exit2','Which set is used to learn word counts?',['Training','Test','Unlabeled application data'],0,'Only training data supplies learned vocabulary, label frequencies and word counts.')}${quiz('exit3','What should we do with a confident but suspicious prediction?',['Accept it automatically','Ask a person to review the original note'],1,'A model can confidently miss negation or unfamiliar wording. Review the note itself.')}<div class="note"><strong>Discuss:</strong> Why can “Never smokes cigarettes” confuse this model? What additional labeled examples could help? Where would a separate validation set fit?</div><details><summary>Instructor discussion notes</summary><p>A bag-of-words model does not understand word order or reliably understand negation. “Smokes” and “cigarettes” are frequent in the smoker training group. More varied labeled examples can help, but counts alone still have limits. A validation set is used for model choices before a final untouched test. The provided figure uses its test set to compare classifiers; a stronger future study would keep an additional independent final evaluation.</p></details><button onclick="window.print()">Print this recap</button>`;
$('stage').innerHTML=content;}
function trainingView(){return `<h3>What the model learned</h3><p>Each label has two of the six training notes: its starting chance, or <strong>prior</strong>, is 2/6.</p><div class="table-wrap"><table><tr><th>Training word</th>${classes.map(c=>`<th>${c}</th>`).join('')}</tr>${model.vocab.map(w=>`<tr><td>${w}</td>${classes.map((_,c)=>`<td>${model.counts[c][w]||0}</td>`).join('')}</tr>`).join('')}</table></div><p><strong>Your turn:</strong> Which label has seen “never” most often?</p>${quiz('count','Choose a label',classes,1,'“Never” appears twice in the non-smoker training notes and zero times in the others.')}<p>For a new note, Naive Bayes combines the starting chance of a label with the word evidence. The label with the highest combined score wins.</p><details><summary>Optional: see the small calculation</summary><p>We use multinomial Naive Bayes: count every word occurrence. To avoid a zero score when a word was not seen for a label, add 1 to each word count (Laplace smoothing).</p><p>Word chance = (word count in that label + 1) ÷ (all word occurrences in that label + vocabulary size).</p><p>There are ${model.vocab.length} different training words. “Never” has chance 3/(${model.totals[1]} + ${model.vocab.length}) for non-smoker, versus 1/(${model.totals[0]} + ${model.vocab.length}) for smoker.</p><p>Label score = starting chance × word chance × word chance … The code uses log scores for numerical stability. “Naive” means that, given the label, word occurrences are treated as independent. That simplifying assumption ignores context.</p></details>`;}
function testView(){let matrix=classes.map(()=>[0,0,0]);notes.slice(6).forEach(n=>matrix[n.gold][predict(n.text).pred]++);return `<div class="table-wrap"><table><tr><th>Note</th><th>Human answer</th><th>Model prediction</th><th>Match?</th></tr>${notes.slice(6).map(n=>{let p=predict(n.text);return `<tr><td>${n.id}</td><td>${classes[n.gold]}</td><td>${classes[p.pred]}</td><td>${p.pred===n.gold?'Yes':'No'}</td></tr>`}).join('')}</table></div><h3>Count correct and incorrect predictions</h3><div class="table-wrap"><table><tr><th>Human ↓ / Model →</th>${classes.map(c=>`<th>${c}</th>`).join('')}</tr>${matrix.map((r,c)=>`<tr><th>${classes[c]}</th>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div><p>This is a <strong>confusion matrix</strong>. Matches are on the diagonal; mistakes would appear elsewhere.</p><div class="grid"><div class="card"><strong>Precision</strong><p>When it predicts a label, how often is it right?</p></div><div class="card"><strong>Recall</strong><p>Of the notes truly in a label, how many does it find?</p></div><div class="card"><strong>F1</strong><p>A combined score that balances precision and recall.</p></div></div><div class="table-wrap"><table><tr><th>Label</th><th>Precision</th><th>Recall</th><th>F1</th></tr>${classes.map((c,i)=>{let tp=matrix[i][i],pred=matrix.reduce((s,r)=>s+r[i],0),actual=matrix[i].reduce((a,b)=>a+b,0),p=pred?tp/pred:0,r=actual?tp/actual:0,f=p+r?2*p*r/(p+r):0;return `<tr><td>${c}</td><td>${tp}/${pred} = ${p.toFixed(2)}</td><td>${tp}/${actual} = ${r.toFixed(2)}</td><td>${f.toFixed(2)}</td></tr>`}).join('')}</table></div>${quiz('metric','The model predicts “smoker” for 5 notes; 4 really are smokers. What is precision?',['4 out of 5','5 out of 4','We need all non-smoker notes'],0,'Precision asks how many predicted smokers are really smokers: 4/5, or 80%.')}`;}
function setNoteLabel(id,value){labels[id]=String(value);}
function setNoteSplit(id,value){split[id]=String(value);}
function syncVisibleSelections(){
 document.querySelectorAll("select[data-note-label]").forEach(el=>setNoteLabel(el.dataset.noteLabel,el.value));
 document.querySelectorAll("select[data-note-split]").forEach(el=>setNoteSplit(el.dataset.noteSplit,el.value));
}
function checkLabels(){syncVisibleSelections();let missing=notes.filter(n=>labels[n.id]===undefined||labels[n.id]==='');let wrong=notes.filter(n=>labels[n.id]!==undefined&&labels[n.id]!==''&&Number(labels[n.id])!==n.gold);feedback('labelFeedback',missing.length?'Choose labels for: '+missing.map(n=>n.id).join(', '):wrong.length?'Review '+wrong.map(n=>n.id).join(', ')+'. Look for current smoking, “never”, or missing status.':'All nine match the reference labels. Human answers are ready.',!missing.length&&!wrong.length);}
function checkSplit(){syncVisibleSelections();let wrong=notes.filter((n,i)=>split[n.id]!== (i<6?'Training':'Test'));feedback('splitFeedback',wrong.length?'Review '+wrong.map(n=>n.id).join(', ')+'. A–F are practice; G–I are the exam.':'Correct: six training notes and three held-out test notes.',wrong.length===0);}
function applyNote(){let text=$('newNote').value.trim();if(!text){$('prediction').innerHTML='<p class="feedback bad">Enter a fictional note first.</p>';return;}let p=predict(text);$('prediction').innerHTML=`<div class="card"><h3>${p.known.length?(p.tied?'No clear winner (tied scores)':'Prediction: '+classes[p.pred]):'No familiar words: no useful word evidence'}</h3><p>Words the model recognized: ${p.known.length?p.known.map(w=>`<span class="pill">${esc(w)}</span>`).join(''):'none'}</p>${p.ignored.length?`<p>Words outside the training vocabulary, ignored: ${p.ignored.map(esc).join(', ')}</p>`:''}${classes.map((c,i)=>`<div>${c}: ${(p.probs[i]*100).toFixed(1)}%<div class="bar"><span style="width:${p.probs[i]*100}%"></span></div></div>`).join('')}<p class="small muted">These are normalized model scores, not verified clinical probabilities. Does the prediction match your reading of the original note?</p></div>`;}
function go(i){if(i>unlocked)return;step=i;render();$('stage').focus();}
function advance(){syncVisibleSelections();let msg='';if(step===0&&!checked.collect)msg='Choose the correct output first.';if(step===1&&(!cleaned||!checked.negation))msg='Clean the note and answer the negation question first.';if(step===2&&!notes.every(n=>labels[n.id]===String(n.gold)))msg='Label all nine notes correctly, then continue.';if(step===3&&(!notes.every((n,i)=>split[n.id]===(i<6?'Training':'Test'))||!checked.leak))msg='Complete the split and answer the test-set question first.';if(step===4&&!trained)msg='Train the model first.';if(step===5&&!tested)msg='Reveal the test results first.';if(msg){let el=document.createElement('p');el.className='feedback bad';el.setAttribute('role','alert');el.textContent=msg;$('stage').appendChild(el);return;}if(step<7){step++;unlocked=Math.max(unlocked,step);render();$('stage').focus();}}
$('next').onclick=advance;$('back').onclick=()=>go(step-1);$('restart').onclick=()=>{if(!confirm('Restart and clear your answers?'))return;step=0;unlocked=0;cleaned=false;labels={};split={};trained=false;tested=false;applied=false;checked={};model=null;render();};render();
</script></body></html>
